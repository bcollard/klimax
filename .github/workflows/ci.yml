name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: macos-latest  # CGO_ENABLED=1 required; lima/vz links against macOS frameworks
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          # Track the latest stable Go rather than go.mod's floor: stdlib CVEs are
          # fixed by patch releases, and pinning the build toolchain to the module's
          # minimum version means govulncheck flags every new stdlib CVE until the
          # pin is bumped by hand. go.mod keeps declaring the *minimum* Go we support.
          go-version: 'stable'
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Format check
        # go vet does not check formatting, so drift accumulated unnoticed.
        # gofmt -l prints offending files and exits 0, hence the explicit test.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: License check
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... \
            --allowed_licenses=MIT,ISC,BSD-2-Clause,BSD-3-Clause,Apache-2.0,MPL-2.0

      - name: Vulnerability scan (govulncheck)
        env:
          CGO_ENABLED: "1"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: latest
          args: check
