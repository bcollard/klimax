name: Security

# SBOMs are generated per-release (see .goreleaser.yaml). This workflow re-scans
# dependencies on a schedule so newly-disclosed CVEs against unchanged deps are
# caught even when nothing in the repo changed.

on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: macos-latest  # CGO_ENABLED=1 required; lima/vz links against macOS frameworks
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          # Track the latest stable Go rather than go.mod's floor: stdlib CVEs are
          # fixed by patch releases, and pinning the build toolchain to the module's
          # minimum version means govulncheck flags every new stdlib CVE until the
          # pin is bumped by hand. go.mod keeps declaring the *minimum* Go we support.
          go-version: 'stable'
          cache: true

      - name: govulncheck
        env:
          CGO_ENABLED: "1"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
