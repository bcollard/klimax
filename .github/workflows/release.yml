name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # needed to create the GitHub release and upload assets

jobs:
  release:
    runs-on: macos-latest  # ARM64; macOS system clang cross-compiles to amd64 transparently
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # full history so goreleaser can generate the changelog

      - uses: actions/setup-go@v7.0.0
        with:
          # Track the latest stable Go rather than go.mod's floor: stdlib CVEs are
          # fixed by patch releases, and pinning the build toolchain to the module's
          # minimum version means govulncheck flags every new stdlib CVE until the
          # pin is bumped by hand. go.mod keeps declaring the *minimum* Go we support.
          go-version: 'stable'
          cache: true

      - name: Collect third-party licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses save ./cmd/klimax \
            --save_path=.third_party_licenses \
            --force

      - name: Install syft (SBOM generator for goreleaser)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
