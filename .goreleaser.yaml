version: 2

project_name: marina

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/marina
    binary: marina
    # CGO_ENABLED=1 is required: Lima's instance/store packages call into
    # macOS frameworks (Virtualization.framework) at link time on darwin.
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    # macOS system clang handles cross-compilation between amd64/arm64
    # without extra CC flags — the universal SDK covers both targets.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    hooks:
      post:
        # Embed the com.apple.security.virtualization entitlement required to
        # create VMs via Virtualization.framework.
        # For production releases, replace "-" with your Developer ID certificate
        # identity and add a notarize step; otherwise Gatekeeper will block the binary.
        - cmd: codesign --sign - --entitlements entitlements.plist --force "{{ .Path }}"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    files:
      - LICENSE
      - README.md
      - config.example.yaml
      - entitlements.plist
      # Keep each module's own directory. Flattening (strip_parent) put ~70
      # LICENSE files on one path, so the archive held duplicate entries and
      # only the last license survived — and syft, unpacking it for the SBOM,
      # failed on the second copy of a read-only file (v0.2.2's first attempt).
      - src: .third_party_licenses/**/*
        dst: third_party_licenses

checksum:
  name_template: checksums.txt

# Generate an SPDX SBOM (via syft) for each release archive and attach it to the
# GitHub release. syft is installed by the release workflow (anchore/sbom-action).
sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: marina
    binaries: ["marina"]
    repository:
      owner: bcollard
      name: homebrew-marina
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://marina.sh
    description: Lima-based macOS VZ VM + multi-kind cluster manager
    # Transition alias for scripts written against klimax (marina before v1.0):
    # `klimax …` keeps working and runs marina. Drop it in a later release.
    custom_block: |
      binary "marina", target: "klimax"
    caveats: |
      Coming from klimax? Run `marina migrate` once: it moves ~/.klimax (config,
      registry cache) over and deletes the old VM. `klimax` stays available as an
      alias of `marina` for now.

      marina bakes a specific kind CLI and default Kubernetes node image into the
      VM at creation time. Upgrading the marina binary does NOT re-provision an
      existing VM, so after upgrading you should rebuild it:

        marina destroy && marina up

      Then recreate your clusters (marina cluster create <name>). Skipping this can
      leave you on an older kind that cannot create the new default node version.
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
