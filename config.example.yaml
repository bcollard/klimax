# marina configuration file
# Copy to config.yaml and adjust to your needs.
# Run: marina up -c config.yaml

# ── VM ──────────────────────────────────────────────────────────────────────
vm:
  name: "marina"         # Lima instance name; socket exposed at ~/.<name>.docker.sock
  # cpus and memory default to a share of THIS Mac, so the same config suits a
  # 16GiB Air and a 64GiB Studio. Set them to pin a value instead; marina warns
  # on `up` if what you pin exceeds the machine.
  #   cpus:   3/4 of the cores  (10-core M1 Pro -> 8)
  #   memory: half the RAM      (16GiB -> 8GiB, 32GiB -> 16GiB, 64GiB -> 32GiB)
  # cpus: 8
  # memory: "20GiB"
  disk: "20GiB"       # default. Only the OS, Docker metadata and volumes live here —
                      # images go on imageDisk below. Sparse: it costs what it holds.
                      # Grow later without recreating the VM: marina disk resize 40GiB
  # Extra certificate authorities to trust — a proxy that terminates TLS
  # (corporate interception), or a private registry with a self-signed chain.
  # Installed in the VM, in every registry mirror, and in every kind node:
  # each has its own trust store.
  # caCerts:
  #   files: ["~/corp-root-ca.pem"]

  # Enable Rosetta 2 for transparent amd64 container support (Apple Silicon only).
  # Requires Rosetta to be installed on the host:  softwareupdate --install-rosetta
  # rosetta: false
  # Persistent container image store. marina attaches a separate Lima data disk
  # ($LIMA_HOME/_disks/<vm>-img) and mounts it over /var/lib/containerd in the
  # guest, so kindest/node, registry:2 and any locally built images survive
  # `marina destroy`. A locally built image is the only kind no registry mirror
  # can restore.
  # Always on; defaults to "30GiB". There is no way to put the image store back
  # on the root disk — an empty value is treated as unset and re-defaulted.
  # WARNING: only takes effect on new VMs (marina destroy && marina up).
  imageDisk: "30GiB"
  #
  # NOTE: this size applies only when the disk is first created. Raising it later
  # does not grow an existing disk — resize that explicitly, which keeps the
  # cached images instead of re-pulling them:
  #   marina down && marina disk resize-image 30GiB && marina up

  # Host directories shared into the guest over virtiofs. Empty by default:
  # marina shares nothing of yours, only its own registry cache.
  #
  # Each directory appears in the VM at the SAME absolute path, and that is what
  # makes a host-path bind work from macOS:
  #
  #   docker run -v ~/projects/conf:/etc/app ...
  #
  # The Docker daemon runs inside the VM and resolves the bind source there, so
  # the path has to exist on both sides. WITHOUT a matching entry here that bind
  # does not fail — dockerd creates the missing path in the guest and the
  # container sees an EMPTY directory.
  #
  # writable defaults to false (matching Lima). A read-only share is the safer
  # thing to hand a container by accident, so opt in per directory.
  #
  # Unlike imageDisk and disablePortMirroring, this list does NOT need the VM
  # recreated: `marina up` spots the change and offers to restart the VM
  # (`marina status` shows the VM's current shares and flags a pending change).
  # A restart still stops every kind cluster on the VM.
  mounts: []
  # mounts:
  #   - location: "~/projects"     # host path; "~" is expanded
  #     writable: true             # default false
  #   - location: "~/data"
  #     mountPoint: "/srv/data"    # optional: a different guest path.
  #                                # Leave it out unless you mean it — a guest
  #                                # path that differs from the host path is the
  #                                # one case where `-v <host path>` stops working.

# ── Networking ───────────────────────────────────────────────────────────────
network:
  # HTTP(S) proxy for everything marina runs in the VM: dockerd, the registry
  # mirrors, and the containerd inside every kind node.
  #
  # Leave this out on a normal network. marina already picks up the Mac's system
  # proxy settings on its own — this block is only for pointing at a different
  # proxy, or for a proxy macOS does not know about.
  #
  # marina computes no_proxy itself (the kind bridge CIDR, the cluster subnets,
  # the mirror names, the host<->VM subnet); noProxy below is appended to that.
  # proxy:
  #   http:  "http://proxy.corp:3128"
  #   https: "http://proxy.corp:3128"
  #   noProxy: ["*.corp.example"]
  #   inheritFromHost: true   # default; use macOS settings when http/https are unset

  # Subnet for the Docker bridge network named "kind".
  # macOS routes this CIDR → VM's lima0 IP for pure L3 access (no SNAT).
  kindBridgeCIDR: "172.30.0.0/16"

  # Disable Lima's automatic TCP port mirroring from the VM to 127.0.0.1 on the host.
  # Default: true — Lima's TCP auto-mirroring is disabled, so marina coexists cleanly
  # with other Lima-based VMs (kind-on-lima, Rancher Desktop) that also manage kind
  # clusters. Without this, both VMs race to mirror the same API-server port (e.g.
  # 7001) to 127.0.0.1, corrupting each other's kubeconfig connectivity.
  #
  # When true (default):
  #   - Lima TCP auto-mirroring is disabled for all ports in the marina VM.
  #   - Kubeconfigs use the VM's direct lima0 IP (e.g. 192.168.64.3:700N) instead
  #     of 127.0.0.1:700N. The lima0 IP is L2-reachable from the host via vzNAT.
  #   - The API server cert includes the lima0 IP as a SAN (added automatically).
  #   - Re-run 'marina kubeconfig merge <name>' after each VM restart to refresh the
  #     address if the lima0 IP changes (vzNAT assigns IPs dynamically).
  #
  # Set to false to force loopback (127.0.0.1) addressing — e.g. if host-based
  # security software (CrowdStrike) blocks TCP connections to vzNAT IPs, or if you
  # run only a single marina VM and prefer stable 127.0.0.1 kubeconfigs.
  #
  # ⚠ VM-level setting: only takes effect on new VMs (marina destroy && marina up).
  # disablePortMirroring: true

  # Local DNS for LoadBalancer Services, with no domain to own.
  # Every LoadBalancer Service gets <service>.<namespace>.<cluster>.<domain>,
  # resolvable from the Mac, the VM and every pod. Ingress hosts under
  # *.<cluster>.<domain> are published too, and an
  # external-dns.kubernetes.io/hostname annotation adds a custom name.
  #
  # What marina runs for it:
  #   - etcd + CoreDNS containers on the kind network (x.y.255.52 / x.y.255.53)
  #   - ExternalDNS in each cluster created while this is on
  #     (existing clusters: marina dns attach <cluster>)
  #   - /etc/resolver/<domain> on the Mac — written once, needs sudo once
  #
  # Applied on every `marina up`; false removes all of the above.
  dns:
    enabled: true
    # .internal is reserved by ICANN for private use. Keep a subdomain: GCP and
    # many corporate networks already use other names under .internal.
    domain: "marina.internal"
    # Automatic name, relative to <cluster>.<domain> (ExternalDNS --fqdn-template;
    # fields .Name .Namespace .Labels .Annotations). Override per Service with the
    # external-dns.kubernetes.io/hostname annotation.
    nameTemplate: "{{.Name}}.{{.Namespace}}"
    # Local CA for the zone. marina creates a root in ~/.marina/pki/<domain>/,
    # name-constrained to .<domain> and trusted in the System keychain (sudo once),
    # an intermediate per cluster constrained to .<cluster>.<domain>, and a
    # *.<cluster>.<domain> wildcard as the Secret default/marina-wildcard-tls.
    # With cert-manager in the cluster, `marina ca attach` adds a marina-ca
    # ClusterIssuer. marina never installs cert-manager itself.
    tls:
      enabled: true

# ── Kind clusters ────────────────────────────────────────────────────────────
kind:
  # kindest/node image tag used when creating clusters.
  # ⚠ Matched to the kind CLI bundled in the VM. Changing it to another kindest/node
  # tag is UNSUPPORTED and may cause cluster creation to fail or hang (kubeadm/containerd
  # errors) or behave unexpectedly. 'marina cluster create' warns when this is overridden.
  nodeVersion: "v1.36.1"

  # MetalLB manifest version installed in every cluster.
  metalLBVersion: "v0.16.1"

  # Custom DNS zones forwarded to specific upstream resolvers by CoreDNS.
  # Each entry takes a domain and an optional list of resolvers.
  # Resolvers default to [8.8.8.8, 8.8.4.4] when omitted.
  # Applied to every cluster at creation time.
  customDnsResolvers:
    - domain: "runlocal.dev"
      # resolvers: ["8.8.8.8", "8.8.4.4"]  # default; omit to use Google DNS

    # Forward an internal zone to a private resolver (e.g. your corporate DNS):
    # - domain: "corp.internal"
    #   resolvers: ["10.0.0.53"]

    # Multiple resolvers for redundancy:
    # - domain: "local.test"
    #   resolvers: ["1.1.1.1", "1.0.0.1"]

  # Automatically merge the new cluster's context into ~/.kube/config after creation.
  # Set to false to manage kubeconfig manually via 'marina cluster merge <name>'.
  # autoMergeKubeconfig: true

  # Automatically remove the cluster's context/cluster/user from ~/.kube/config on deletion.
  # autoRemoveKubeconfig: true

# ── Registries ───────────────────────────────────────────────────────────────
registries:
  # Where mirror registry cache data is persisted across container restarts.
  # "host" (default): ~/.marina/registry-cache/<name>/ on the macOS host,
  #   virtiofs-mounted into the guest — cache survives 'marina destroy'.
  # "guest": /var/lib/marina/registry-cache/<name>/ inside the VM only —
  #   cache is wiped on 'marina destroy'.
  # cacheStorage: "host"

  # Pull-through mirror containers running in the VM.
  # All mirrors are connected to the "kind" Docker network so cluster nodes
  # resolve them by hostname (e.g. registry-dockerio:5030).
  # Set to an empty list ([]) to disable all mirrors.
  #
  # ⚠ A mirror `name` must NOT be a hostname (no '.' or ':'). The container joins
  # the "kind" network, and a name like "quay.io" would make Docker DNS resolve
  # quay.io to the container itself — the proxy could no longer reach the real
  # upstream, silently falling back to slow, unauthenticated direct pulls.
  # Use names like registry-quayio / registry-dockerio (marina rejects hostname names).
  mirrors:
    - name: "registry-dockerio"
      port: 5030
      remoteURL: "https://registry-1.docker.io"
      # Optional Docker Hub credentials to avoid rate limits:
      # username: "your-dockerhub-username"
      # password: "your-dockerhub-password"

    - name: "registry-quayio"
      port: 5010
      remoteURL: "https://quay.io"

    - name: "registry-gcrio"
      port: 5020
      remoteURL: "https://gcr.io"

    # Google Artifact Registry mirrors:
    - name: "registry-us-docker-pkgdev"
      port: 5040
      remoteURL: "https://us-docker.pkg.dev"

    - name: "registry-us-central1-docker-pkgdev"
      port: 5050
      remoteURL: "https://us-central1-docker.pkg.dev"
